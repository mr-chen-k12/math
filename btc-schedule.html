<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bridge to Physics 2026 — Study Portal</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" id="MathJax-script" async></script>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --correct: #22c55e;
            --incorrect: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--bg-secondary);
            padding: 1.5rem 2rem;
            border-bottom: 2px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.5rem;
            color: var(--accent);
            letter-spacing: 0.5px;
        }

        .container {
            display: flex;
            flex: 1;
            padding: 2rem;
            gap: 2rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        /* Sidebar styling */
        .sidebar {
            flex: 1;
            max-width: 320px;
            background-color: var(--bg-secondary);
            border-radius: 12px;
            padding: 1.5rem;
            height: fit-content;
            border: 1px solid #334155;
        }

        .sidebar h2 {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            border-bottom: 1px solid #334155;
            padding-bottom: 0.5rem;
        }

        .date-selector {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--bg-primary);
            color: var(--text-main);
            border: 1px solid #475569;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            margin-bottom: 1.5rem;
        }

        .canvas-container {
            text-align: center;
            background: var(--bg-primary);
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid #334155;
        }

        .canvas-container p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
        }

        /* Main Content Panel */
        .main-panel {
            flex: 2.5;
            background-color: var(--bg-secondary);
            border-radius: 12px;
            padding: 2rem;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
        }

        .topic-header {
            margin-bottom: 2rem;
        }

        .topic-header h2 {
            font-size: 1.8rem;
            color: var(--text-main);
        }

        .topic-header p {
            color: var(--accent);
            margin-top: 0.25rem;
            font-weight: 500;
        }

        /* Quiz UI Elements */
        .quiz-container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .question-card {
            background-color: var(--bg-primary);
            border-radius: 8px;
            padding: 1.5rem;
            border: 1px solid #334155;
            transition: transform 0.2s ease;
        }

        .question-text {
            font-size: 1.1rem;
            margin-bottom: 1rem;
            line-height: 1.5;
        }

        .options-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .option-item {
            padding: 0.75rem 1rem;
            background-color: var(--bg-secondary);
            border: 1px solid #475569;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-item:hover {
            border-color: var(--accent);
            background-color: rgba(56, 189, 248, 0.05);
        }

        .option-item.correct {
            background-color: rgba(34, 197, 94, 0.15) !important;
            border-color: var(--correct) !important;
            color: #4ade80;
        }

        .option-item.incorrect {
            background-color: rgba(239, 68, 68, 0.15) !important;
            border-color: var(--incorrect) !important;
            color: #f87171;
        }

        .explanation {
            margin-top: 1rem;
            padding: 0.75rem;
            background-color: #1e293b;
            border-left: 4px solid var(--accent);
            border-radius: 0 4px 4px 0;
            font-size: 0.95rem;
            color: var(--text-muted);
            display: none;
        }

        @media (max-width: 900px) {
            .container {
                flex-direction: column;
            }
            .sidebar {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>

    <header>

            <div id="quiz-space" class="quiz-container">

        </div>
    </div>

                        "options": [

                        ],

                        "explanation": "The perpendicular vector constraint \\(mg \\sin(\\theta)\\) acts directly along the path back toward the center rest point."
                    }
                ]
            },
            
            "2026-07-05": {
    "title": "Free Fall Experiment Analysis",
    "subtitle": "Lab focus: Video Analysis, Mean, Standard Deviation, and Error Propagation",
    "questions": [

            "explanation": "Standard error is calculated as \\(\\delta x = \\frac{S}{\\sqrt{n}}\\). It represents the precision of your sample mean estimate relative to the true population mean."

        {

            "options": [

            /* You can append future dates here easily like:
            ,"2026-07-07": {
                "title": "The Force, Types of Force",
                "subtitle": "Measuring the Force of Jedi",
                "questions": [ ... ]
            }
            */
        };

        // UI Management Logic
        function loadQuizForDate(dateStr) {
            const data = b2pDatabase[dateStr];
            if (!data) return;

            document.getElementById('current-display-date').innerText = dateStr;
            document.getElementById('topic-title').innerText = data.title;
            document.getElementById('topic-sub').innerText = data.subtitle;

            const quizSpace = document.getElementById('quiz-space');
            quizSpace.innerHTML = ''; // Reset UI

            data.questions.forEach((q, qIndex) => {
                const card = document.createElement('div');
                card.className = 'question-card';

                const qText = document.createElement('div');
                qText.className = 'question-text';
                qText.innerHTML = `<strong>Q${qIndex + 1}:</strong> ${q.question}`;
                card.appendChild(qText);

                const optList = document.createElement('ul');
                optList.className = 'options-list';

                q.options.forEach((opt, oIndex) => {
                    const li = document.createElement('li');
                    li.className = 'option-item';
                    li.innerText = opt;
                    li.onclick = function() {
                        checkAnswer(li, oIndex, q.correct, card);
                    };
                    optList.appendChild(li);
                });

                card.appendChild(optList);

                const exp = document.createElement('div');
                exp.className = 'explanation';
                exp.innerHTML = q.explanation;
                card.appendChild(exp);

                quizSpace.appendChild(card);
            });

            // Re-run MathJax processing on newly added HTML strings
            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        }

        function checkAnswer(selectedOptionElement, selectedIdx, correctIdx, cardElement) {
            const items = cardElement.querySelectorAll('.option-item');
            
            // Lock out clicking other questions once chosen
            items.forEach(item => item.removeAttribute('onclick'));

            if (selectedIdx === correctIdx) {
                selectedOptionElement.classList.add('correct');
            } else {
                selectedOptionElement.classList.add('incorrect');
                items[correctIdx].classList.add('correct'); // reveal correct
            }

            // Reveal step-by-step mathematical explanation
            const explanationDiv = cardElement.querySelector('.explanation');
            explanationDiv.style.display = 'block';
        }

        // Initialize Canvas Simulation for Pendulum Physics
        const canvas = document.getElementById('pendulumCanvas');
        const ctx = canvas.getContext('2d');

        let angle = Math.PI / 4; 
        let angleVelocity = 0.0;
        let angleAcceleration = 0.0;
        
        const originX = 120;
        const originY = 20;
        const length = 140;
        const gravity = 0.4; // Scaled down for visual fluid framework

        function updateAndRenderPendulum() {
            // Formula: alpha = -g / L * sin(theta)
            angleAcceleration = (-gravity / length) * Math.sin(angle);
            angleVelocity += angleAcceleration;
            angle += angleVelocity;

            // Apply light damping friction to stabilize visual over time
            angleVelocity *= 0.999; 

            // Clear Screen
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Compute structural endpoint coordinates
            const bobX = originX + length * Math.sin(angle);
            const bobY = originY + length * Math.cos(angle);

            // Draw Suspension Support Line
            ctx.beginPath();
            ctx.moveTo(originX, originY);
            ctx.lineTo(bobX, bobY);
            ctx.strokeStyle = '#64748b';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Draw Anchor Ceiling block
            ctx.beginPath();
            ctx.arc(originX, originY, 4, 0, 2 * Math.PI);
            ctx.fillStyle = '#38bdf8';
            ctx.fill();

            // Draw Bob weight mass
            ctx.beginPath();
            ctx.arc(bobX, bobY, 14, 0, 2 * Math.PI);
            ctx.fillStyle = '#38bdf8';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#38bdf8';
            ctx.fill();
            ctx.shadowBlur = 0; // reset shadow glow

            requestAnimationFrame(updateAndRenderPendulum);
        }

        // Initialize app on viewport window load
        window.onload = function() {
            loadQuizForDate("2026-07-06");
            updateAndRenderPendulum();
        };
    </script>
</body>
</html>
